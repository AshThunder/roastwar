<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </radialGradient>
    
    <!-- Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="50%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>

    <!-- Sword & Outline Gradient -->
    <linearGradient id="swordGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded App Icon Background -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Crossed Swords (Back layer) -->
  <g stroke="url(#swordGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Sword 1: Top-Left to Bottom-Right -->
    <path d="M 24 24 L 76 76" />
    <path d="M 24 24 L 20 32 L 28 36 Z" fill="#FB923C" />
    <!-- Guard & Pommel 1 -->
    <path d="M 66 76 L 76 66" stroke-width="3.5" />
    <circle cx="78" cy="78" r="2.5" fill="#FB923C" />

    <!-- Sword 2: Top-Right to Bottom-Left -->
    <path d="M 76 24 L 24 76" />
    <path d="M 76 24 L 80 32 L 72 36 Z" fill="#FB923C" />
    <!-- Guard & Pommel 2 -->
    <path d="M 34 76 L 24 66" stroke-width="3.5" />
    <circle cx="22" cy="78" r="2.5" fill="#FB923C" />
  </g>

  <!-- Roaring Flame (Middle layer with glow) -->
  <path d="M 50 14 C 42 26 34 34 34 50 C 34 66 43 72 50 72 C 57 72 66 66 66 50 C 66 34 58 26 50 14 Z" 
        fill="url(#flameGrad)" 
        filter="url(#glow)" 
        opacity="0.95"/>
  
  <path d="M 50 24 C 45 32 40 40 40 52 C 40 62 46 66 50 66 C 54 66 60 62 60 52 C 60 40 55 32 50 24 Z" 
        fill="#FEF08A" 
        opacity="0.85"/>

  <!-- Vintage Comedy Microphone (Foreground layer) -->
  <!-- Mic Head Capsule -->
  <rect x="43" y="38" width="14" height="20" rx="7" fill="#0B0F19" stroke="#FFFFFF" stroke-width="2.5"/>
  
  <!-- Mic Grid lines -->
  <line x1="43" y1="45" x2="57" y2="45" stroke="#F97316" stroke-width="1.5"/>
  <line x1="43" y1="51" x2="57" y2="51" stroke="#F97316" stroke-width="1.5"/>
  <line x1="50" y1="38" x2="50" y2="58" stroke="#F97316" stroke-width="1.5"/>

  <!-- Mic U-Bracket Mount -->
  <path d="M 39 48 C 39 60 61 60 61 48" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Mic Stand & Base -->
  <line x1="50" y1="58" x2="50" y2="68" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 42 68 L 58 68" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
</svg>
